<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتحليل نتائج الطلاب - Task 2</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>مشروع إدارة وتحليل نتائج الطلاب</h1>
    <p>تم تشغيل النظام بنجاح. يرجى فتح وحدة التحكم (F12 أو Inspect ثم Console) لعرض نتائج تحليل الطلاب.</p>

    <script>
        // تعريف فئة الطالب (Student Class)
        class Student {
            constructor(name, id, grades) {
                this.name = name;
                this.id = id;
                this.grades = grades; // مصفوفة الدرجات
            }

            // حساب المعدل أو المجموع
            calculateAverage() {
                let sum = this.grades.reduce((total, grade) => total + grade, 0);
                return sum / this.grades.length;
            }
        }

        // إنشاء بيانات تجريبية للطلاب
        const students = [
            new Student("أحمد علي", "101", [85, 90, 92]),
            new Student("فاطمة محمد", "102", [78, 88, 95]),
            new Student("سارة خالد", "103", [90, 92, 96])
        ];

        // دالة تحليل النتائج وعرضها في وحدة التحكم (Console)
        function analyzeStudents(studentList) {
            console.log("=== نظام إدارة وتحليل نتائج الطلاب ===");
            studentList.forEach(student => {
                let avg = student.calculateAverage();
                console.log(`الطالب: ${student.name} | الرقم الجامعي: ${student.id} | المعدل: ${avg.toFixed(2)}`);
            });
        }

        // تشغيل النظام
        analyzeStudents(students);
    </script>

</body>
</html>
